{% extends 'customer_module/base.html' %}

{% block content %}
    {% if user.is_authenticated %}
        <h1>Create New Order</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    {% else %}
        <h1>Create New Order (Login Required)</h1>
    {% endif %}
{% endblock %}
